name: import-v1-history

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  import:
    if: github.event.pull_request.head.ref == 'feat/v1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Import validated milestone history
        env:
          GH_TOKEN: ${{ github.token }}
          FILTER_BRANCH_SQUELCH_WARNING: "1"
        run: |
          set -euo pipefail
          cat .bootstrap/part* | base64 --decode | xz --decompress > /tmp/opshaven.fast-export
          mkdir /tmp/opshaven-import
          git -C /tmp/opshaven-import init
          git -C /tmp/opshaven-import fast-import < /tmp/opshaven.fast-export
          test "$(git -C /tmp/opshaven-import rev-parse refs/heads/main)" = "dbdd746e1a3d3aa4384c37b3d0600ae2861f9ca7"
          git -C /tmp/opshaven-import symbolic-ref HEAD refs/heads/main
          git -C /tmp/opshaven-import reset --hard refs/heads/main
          git -C /tmp/opshaven-import filter-branch --force \
            --index-filter 'git rm -r --cached --ignore-unmatch .github/workflows' \
            -- refs/heads/main
          test -z "$(git -C /tmp/opshaven-import ls-tree -r --name-only refs/heads/main .github/workflows)"
          git -C /tmp/opshaven-import remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C /tmp/opshaven-import push --force origin refs/heads/main:refs/heads/feat/v1
