name: CI
on:
  push:
    branches: [main, fix/v1-1-clean-room-reliability]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run release:check
  reproducible:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: scripts/check-reproducible-build.sh
  repair-controlled-confinement:
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/v1-1-clean-room-reliability'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/v1-1-clean-room-reliability
          fetch-depth: 0
      - name: Apply mode-specific confinement repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          controlled = Path("packaging/opshaven-controlled-force-command")
          text = controlled.read_text()
          old = "  --no-new-privs \\\n"
          if text.count(old) != 1:
              raise SystemExit("controlled no-new-privs marker missing")
          controlled.write_text(text.replace(old, "", 1))

          install = Path("src/setup/install.ts")
          text = install.read_text()
          old = '''export function renderReadonlyWrapper(template: string, nodePath: string, runtimeRoot: string): string {
            for (const required of ["--no-new-privs", "--inh-caps=-all", "--ambient-caps=-all", "--reset-env"]) {
              if (!template.includes(required)) throw new OpsHavenError("POLICY_DENIED", `Forced-command wrapper template is missing ${required}.`);
            }
            if (template.includes("--bounding-set")) throw new OpsHavenError("POLICY_DENIED", "Forced-command wrapper template contains the incompatible bounding-set transition.");
            if (!/^\\/[A-Za-z0-9._/+-]+$/.test(nodePath) || !/^\\/[A-Za-z0-9._/+-]+$/.test(runtimeRoot)) throw new OpsHavenError("CONFIG_INVALID", "Resolved wrapper paths are invalid.");
            const controlledPlaceholder = "/usr/lib/opshaven/dispatcher.js";
            const readOnlyPlaceholder = "/usr/lib/opshaven/read-only-dispatcher.js";
            const controlled = template.includes(controlledPlaceholder);
            const placeholder = controlled ? controlledPlaceholder : readOnlyPlaceholder;'''
          new = '''export function renderReadonlyWrapper(template: string, nodePath: string, runtimeRoot: string): string {
            const controlledPlaceholder = "/usr/lib/opshaven/dispatcher.js";
            const readOnlyPlaceholder = "/usr/lib/opshaven/read-only-dispatcher.js";
            const controlled = template.includes(controlledPlaceholder);
            const readOnly = template.includes(readOnlyPlaceholder);
            if (controlled === readOnly) throw new OpsHavenError("POLICY_DENIED", "Forced-command wrapper must select exactly one dispatcher mode.");
            const requiredFlags = controlled
              ? ["--inh-caps=-all", "--ambient-caps=-all", "--reset-env"]
              : ["--no-new-privs", "--inh-caps=-all", "--ambient-caps=-all", "--reset-env"];
            for (const required of requiredFlags) {
              if (!template.includes(required)) throw new OpsHavenError("POLICY_DENIED", `Forced-command wrapper template is missing ${required}.`);
            }
            if (controlled && template.includes("--no-new-privs")) {
              throw new OpsHavenError("POLICY_DENIED", "Controlled dispatcher cannot use no-new-privileges because exact approved OS privilege transitions would be impossible.");
            }
            if (template.includes("--bounding-set")) throw new OpsHavenError("POLICY_DENIED", "Forced-command wrapper contains the incompatible bounding-set transition.");
            if (!/^\\/[A-Za-z0-9._/+-]+$/.test(nodePath) || !/^\\/[A-Za-z0-9._/+-]+$/.test(runtimeRoot)) throw new OpsHavenError("CONFIG_INVALID", "Resolved wrapper paths are invalid.");
            const placeholder = controlled ? controlledPlaceholder : readOnlyPlaceholder;'''
          if text.count(old) != 1:
              raise SystemExit("wrapper renderer marker missing")
          install.write_text(text.replace(old, new, 1))

          tests = Path("tests/remote-setup-install.test.ts")
          text = tests.read_text()
          old_test = '''test("generated controlled wrapper fixes Node and dispatcher paths without weakening confinement", () => { const template = "#!/bin/sh\\nexec /usr/bin/setpriv --no-new-privs --inh-caps=-all --ambient-caps=-all --reset-env /usr/bin/env PATH=/usr/bin:/bin /usr/bin/node /usr/lib/opshaven/dispatcher.js \\\"$@\\\"\\n"; const rendered = renderReadonlyWrapper(template, "/usr/local/bin/node", "/usr/lib/opshaven"); assert.equal(rendered.includes("/usr/local/bin/node /usr/lib/opshaven/src/remote/dispatcher.js"), true); assert.equal(rendered.includes("--bounding-set"), false); for (const flag of ["--no-new-privs", "--inh-caps=-all", "--ambient-caps=-all", "--reset-env"]) assert.equal(rendered.includes(flag), true); });'''
          new_test = '''test("generated controlled wrapper permits only policy-scoped OS privilege transitions", () => { const template = "#!/bin/sh\\nexec /usr/bin/setpriv --inh-caps=-all --ambient-caps=-all --reset-env /usr/bin/env PATH=/usr/bin:/bin /usr/bin/node /usr/lib/opshaven/dispatcher.js \\\"$@\\\"\\n"; const rendered = renderReadonlyWrapper(template, "/usr/local/bin/node", "/usr/lib/opshaven"); assert.equal(rendered.includes("/usr/local/bin/node /usr/lib/opshaven/src/remote/dispatcher.js"), true); assert.equal(rendered.includes("--no-new-privs"), false); assert.equal(rendered.includes("--bounding-set"), false); for (const flag of ["--inh-caps=-all", "--ambient-caps=-all", "--reset-env"]) assert.equal(rendered.includes(flag), true); assert.throws(() => renderReadonlyWrapper(template.replace("--inh-caps=-all ", "--no-new-privs "), "/usr/local/bin/node", "/usr/lib/opshaven"), /no-new-privileges|missing --inh-caps/); });
          test("generated read-only wrapper retains no-new-privileges", () => { const template = "#!/bin/sh\\nexec /usr/bin/setpriv --no-new-privs --inh-caps=-all --ambient-caps=-all --reset-env /usr/bin/env PATH=/usr/bin:/bin /usr/bin/node /usr/lib/opshaven/read-only-dispatcher.js \\\"$@\\\"\\n"; const rendered = renderReadonlyWrapper(template, "/usr/local/bin/node", "/usr/lib/opshaven"); for (const flag of ["--no-new-privs", "--inh-caps=-all", "--ambient-caps=-all", "--reset-env"]) assert.equal(rendered.includes(flag), true); });'''
          if text.count(old_test) != 1:
              raise SystemExit("controlled wrapper test marker missing")
          text = text.replace(old_test, new_test, 1)
          old_fixture = 'await fs.writeFile(raw.local.wrapperTemplatePath, "#!/bin/sh\\nexec /usr/bin/setpriv --no-new-privs --inh-caps=-all --ambient-caps=-all --reset-env /usr/bin/env PATH=/usr/bin:/bin /usr/bin/node /usr/lib/opshaven/dispatcher.js \\\"$@\\\"\\n", { mode: 0o600 });'
          new_fixture = 'await fs.writeFile(raw.local.wrapperTemplatePath, "#!/bin/sh\\nexec /usr/bin/setpriv --inh-caps=-all --ambient-caps=-all --reset-env /usr/bin/env PATH=/usr/bin:/bin /usr/bin/node /usr/lib/opshaven/dispatcher.js \\\"$@\\\"\\n", { mode: 0o600 });'
          if text.count(old_fixture) != 1:
              raise SystemExit("controlled wrapper fixture marker missing")
          tests.write_text(text.replace(old_fixture, new_fixture, 1))

          docs = Path("docs/security.md")
          text = docs.read_text()
          old_docs = '''The isolated read-only launcher uses no-new-privileges and an empty capability set. The reference systemd profile adds private temporary space, filesystem protections, restricted address families, device isolation, and syscall filtering where supported.

          Controlled mode intentionally requires narrowly documented exceptions for approved deployment writes, configured health-probe networking, and exact systemd sudo transitions. Distribution-specific systemd and syscall behavior must be validated before production adoption.'''
          new_docs = '''The isolated read-only launcher uses no-new-privileges and an empty capability set. The reference systemd profile adds private temporary space, filesystem protections, restricted address families, device isolation, and syscall filtering where supported.

          Controlled mode drops inherited and ambient capabilities and resets the environment, but it does not set no-new-privileges because that kernel flag would make the reviewed exact sudo transition impossible. The restricted account remains outside privileged groups; host policy must allow only the exact reviewed service restart commands. Signed operation approval, dispatcher allowlists, configured service identity, and the host sudoers rule must all agree before a restart can occur.

          Controlled mode intentionally requires narrowly documented exceptions for approved deployment writes, configured health-probe networking, and exact systemd sudo transitions. Distribution-specific systemd and syscall behavior must be validated before production adoption.'''
          if text.count(old_docs) != 1:
              raise SystemExit("security documentation marker missing")
          docs.write_text(text.replace(old_docs, new_docs, 1))

          fixture = Path("integration/remote-setup-ubuntu/fixture-systemctl")
          text = fixture.read_text()
          start = 'trace=/tmp/opshaven-fixture-systemctl.log\n'
          end = 'case "$unit" in\n'
          if start in text:
              before, remainder = text.split(start, 1)
              _, after = remainder.split(end, 1)
              fixture.write_text(before + end + after)

          clean = Path("integration/clean-room/run.sh")
          text = clean.read_text()
          trace = '''    printf '%s\\n' 'clean-room synthetic restart trace:' >&2
              docker exec "$CONTAINER" sh -c 'test ! -f /tmp/opshaven-fixture-systemctl.log || tail -n 10 /tmp/opshaven-fixture-systemctl.log' >&2 || true
          '''
          if trace in text:
              clean.write_text(text.replace(trace, "", 1))
          PY
      - name: Validate controlled and read-only confinement
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          node --test dist/tests/remote-setup-install.test.js
          node scripts/check-readonly-wrapper.mjs
          npm run format:check
      - name: Commit product repair
        shell: bash
        run: |
          git config user.name "OpsHaven Reliability Bot"
          git config user.email "opshaven-reliability@example.invalid"
          git add packaging/opshaven-controlled-force-command src/setup/install.ts tests/remote-setup-install.test.ts docs/security.md integration/remote-setup-ubuntu/fixture-systemctl integration/clean-room/run.sh
          git commit -m "fix: separate controlled and read-only privilege confinement"
          git push origin HEAD:fix/v1-1-clean-room-reliability
