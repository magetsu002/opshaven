name: CI
on:
  push:
    branches: [main, fix/v1-1-clean-room-reliability]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run release:check
  reproducible:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: scripts/check-reproducible-build.sh
  repair-deployment-errors:
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/v1-1-clean-room-reliability'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/v1-1-clean-room-reliability
          fetch-depth: 0
      - name: Preserve safe deployment stage context
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/remote/deployment.ts")
          text = path.read_text()
          import_marker = 'interface ReleaseRecord { releaseId: string; commit: string; path: string; activatedAt: string; previousPath: string | null; status: "active" | "failed" | "rolled_back"; migrationPolicy: "none" | "manual" }\n\n'
          helper = '''interface ReleaseRecord { releaseId: string; commit: string; path: string; activatedAt: string; previousPath: string | null; status: "active" | "failed" | "rolled_back"; migrationPolicy: "none" | "manual" }

          async function requireDeploymentCommand(
            runner: CommandRunner,
            executable: string,
            args: readonly string[],
            options: RunOptions,
            stage: string,
          ): Promise<string> {
            try {
              return await requireSuccess(runner, executable, args, options);
            } catch (error) {
              if (error instanceof OpsHavenError && error.code !== "REMOTE_OPERATION_FAILED") throw error;
              throw new OpsHavenError("REMOTE_OPERATION_FAILED", `${stage} failed safely.`);
            }
          }

          function safeDeploymentFailure(error: unknown): string {
            return error instanceof OpsHavenError ? error.message : "Deployment transaction failed safely.";
          }

          '''
          if import_marker not in text:
              raise SystemExit("deployment helper marker missing")
          text = text.replace(import_marker, helper, 1)
          text = text.replace(
              'await requireSuccess(this.runner, SUDO, ["--non-interactive", SYSTEMCTL, "restart", this.service(id).unit], limits);',
              'await requireDeploymentCommand(this.runner, SUDO, ["--non-interactive", SYSTEMCTL, "restart", this.service(id).unit], limits, "Approved service restart");',
          )
          text = text.replace(
              'await requireSuccess(this.runner, DOCKER, ["compose", "--project-directory", releasePath, "up", "-d", "--remove-orphans"], limits);',
              'await requireDeploymentCommand(this.runner, DOCKER, ["compose", "--project-directory", releasePath, "up", "-d", "--remove-orphans"], limits, "Approved container activation");',
          )
          text = text.replace(
              'await requireSuccess(this.runner, GIT, ["-C", target.repositoryPath, "worktree", "add", "--detach", releasePath, exactCommit], limits);',
              'await requireDeploymentCommand(this.runner, GIT, ["-C", target.repositoryPath, "worktree", "add", "--detach", releasePath, exactCommit], limits, "Deployment release preparation");',
          )
          text = text.replace(
              'for (const step of [...target.buildSteps, ...target.checkSteps]) await requireSuccess(this.runner, step.executable, replaceArgs(step, target, releasePath, exactCommit), commandOptions(limitsInput, step.cwd === "release" ? releasePath : target.repositoryPath));',
              'for (const step of [...target.buildSteps, ...target.checkSteps]) await requireDeploymentCommand(this.runner, step.executable, replaceArgs(step, target, releasePath, exactCommit), commandOptions(limitsInput, step.cwd === "release" ? releasePath : target.repositoryPath), "Deployment reviewed build or check step");',
          )
          old = '''      try { await this.restore(target, previousPath, limits); }
                catch { throw new OpsHavenError("REMOTE_OPERATION_FAILED", "Deployment failed and the prior activation could not be restored safely."); }'''
          new = '''      try { await this.restore(target, previousPath, limits); }
                catch { throw new OpsHavenError("REMOTE_OPERATION_FAILED", `${safeDeploymentFailure(error)} Prior activation restoration failed safely.`); }'''
          if old not in text:
              raise SystemExit("deployment restore error marker missing")
          text = text.replace(old, new, 1)
          path.write_text(text)

          test_path = Path("tests/deployment.test.ts")
          tests = test_path.read_text()
          marker = 'test("current release cannot escape through a nested symlink", async () => {'
          addition = '''test("deployment command failures retain a safe stage without command payloads", async () => {
            const { root, commit, config, target, runner } = await fixture(true);
            await installCurrent(root, target.currentSymlink);
            const failing: CommandRunner = {
              async run(executable, args, options) {
                if (args.includes("worktree")) return { exitCode: 1, stdout: "synthetic private command output" };
                return await runner.run(executable, args, options);
              },
            };
            await assert.rejects(
              new DeploymentManager(config, failing).deploy(target, { resourceId: "dep.web", commit, dryRun: false }, config.limits),
              (error: unknown) => error instanceof OpsHavenError
                && error.message === "Deployment release preparation failed safely."
                && !error.message.includes("synthetic private command output")
                && !error.message.includes(target.repositoryPath),
            );
          });

          '''
          if marker not in tests:
              raise SystemExit("deployment test insertion marker missing")
          tests = tests.replace(marker, addition + marker, 1)
          test_path.write_text(tests)
          PY
          git config user.name "OpsHaven Reliability Bot"
          git config user.email "opshaven-reliability@example.invalid"
          git add src/remote/deployment.ts tests/deployment.test.ts
          git commit -m "fix: preserve deployment failure stage context"
          git push origin HEAD:fix/v1-1-clean-room-reliability
