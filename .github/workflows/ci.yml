name: CI
on:
  push:
    branches: [main, fix/v1-1-clean-room-reliability]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run release:check
  reproducible:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: scripts/check-reproducible-build.sh
  repair-deployment-identity:
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/v1-1-clean-room-reliability'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/v1-1-clean-room-reliability
          fetch-depth: 0
      - name: Apply reviewed product patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          model = Path("src/deployment/model.ts")
          text = model.read_text()
          old = "export function observedFingerprint(value: ObservedDeploymentState): string { return sha256(value); }"
          if old in text:
              replacement = "\n".join([
                  "export function observedFingerprint(value: ObservedDeploymentState): string {",
                  "  return sha256({",
                  "    currentRevision: value.currentRevision,",
                  "    activeReleaseId: value.activeReleaseId,",
                  "    sourceRepositoryRevision: value.sourceRepositoryRevision,",
                  "    sourceRepositoryDirty: value.sourceRepositoryDirty,",
                  "    serviceIdentifier: value.serviceIdentifier,",
                  "    serviceActiveState: value.serviceActiveState,",
                  "    serviceSubState: value.serviceSubState,",
                  "    serviceExitStatus: value.serviceExitStatus,",
                  "    healthReachable: value.healthReachable,",
                  "    healthExpected: value.healthExpected,",
                  "    healthStatusCode: value.healthStatusCode,",
                  "    runtimeAvailable: value.runtimeAvailable,",
                  "    rollbackAvailable: value.rollbackAvailable,",
                  "    targetRevisionVerified: value.targetRevisionVerified,",
                  "  });",
                  "}",
              ])
              model.write_text(text.replace(old, replacement, 1))
          elif "currentRevision: value.currentRevision" not in text:
              raise SystemExit("observed fingerprint marker missing")

          planning = Path("src/deployment/planning.ts")
          text = planning.read_text()
          if "Available disk space is below the supported deployment minimum. No changes were made." not in text:
              marker = "    return observed;\n  }\n\n  async deploymentDoctor"
              replacement = (
                  "    if (observed.availableDiskBytes < DEPLOYMENT_MINIMUM_DISK_BYTES) {\n"
                  "      throw new OpsHavenError(\"POLICY_DENIED\", \"Available disk space is below the supported deployment minimum. No changes were made.\");\n"
                  "    }\n"
                  "    return observed;\n  }\n\n  async deploymentDoctor"
              )
              if text.count(marker) != 1:
                  raise SystemExit("deployment revalidation marker missing")
              planning.write_text(text.replace(marker, replacement, 1))

          tests = Path("tests/deployment-plans.test.ts")
          text = tests.read_text()
          if "DEPLOYMENT_MINIMUM_DISK_BYTES," not in text:
              text = text.replace(
                  "  DeploymentCoordinator,\n  DeploymentPlanStore,",
                  "  DEPLOYMENT_MINIMUM_DISK_BYTES,\n  DeploymentCoordinator,\n  DeploymentPlanStore,",
                  1,
              )
          if "availableDiskBytes = 10 * 1024 * 1024 * 1024;" not in text:
              text = text.replace(
                  "  healthy = true;\n  mutationCalls = 0;",
                  "  healthy = true;\n  availableDiskBytes = 10 * 1024 * 1024 * 1024;\n  serviceIdentifier = \"sample-api.service\";\n  runtimeAvailable = true;\n  mutationCalls = 0;",
                  1,
              )
              text = text.replace('        unit: "sample-api.service",', "        unit: this.serviceIdentifier,", 1)
              text = text.replace(
                  '        uname: "Linux synthetic 6.0 x86_64 GNU/Linux",\n        rootFilesystem: "/dev/synthetic 1000000 1000 999000 1% /",',
                  '        uname: this.runtimeAvailable ? "Linux synthetic 6.0 x86_64 GNU/Linux" : "",\n'
                  '        rootFilesystem: `/dev/synthetic 20000000 1000 ${Math.floor(this.availableDiskBytes / 1024)} 1% /`,',
                  1,
              )
          if 'test("volatile disk drift preserves exact-plan identity and apply succeeds"' not in text:
              marker = 'test("changed observed state produces a different plan identity", async () => {'
              additions = """test("volatile disk drift preserves exact-plan identity and apply succeeds", async () => {
            const value = await registeredFixture();
            value.client.availableDiskBytes = 10 * 1024 * 1024 * 1024;
            const stored = await value.coordinator.createPlan("sample-api", TARGET);
            value.client.availableDiskBytes -= 100 * 1024 * 1024;
            const repeated = await value.coordinator.createPlan("sample-api", TARGET);
            assert.equal(repeated.planId, stored.planId);
            assert.equal(repeated.plan.observedStateFingerprint, stored.plan.observedStateFingerprint);
            const result = await value.coordinator.applyPlan(stored.planId, { approved: true });
            assert.equal(result.outcome, "DEPLOYMENT_SUCCEEDED");
            assert.equal(value.client.mutationCalls, 1);
          });

          test("insufficient apply-time disk fails before deployment mutation", async () => {
            const value = await registeredFixture();
            const stored = await value.coordinator.createPlan("sample-api", TARGET);
            value.client.availableDiskBytes = DEPLOYMENT_MINIMUM_DISK_BYTES - 1;
            await assert.rejects(
              value.coordinator.applyPlan(stored.planId, { approved: true }),
              (error: unknown) => error instanceof OpsHavenError && error.code === "POLICY_DENIED" && /disk space/i.test(error.message),
            );
            assert.equal(value.client.mutationCalls, 0);
          });

          test("service and runtime drift remain stale-plan blockers", async (t) => {
            await t.test("service identity", async () => {
              const value = await registeredFixture();
              const stored = await value.coordinator.createPlan("sample-api", TARGET);
              value.client.serviceIdentifier = "other.service";
              await assert.rejects(value.coordinator.applyPlan(stored.planId, { approved: true }), OpsHavenError);
              assert.equal(value.client.mutationCalls, 0);
            });
            await t.test("runtime readiness", async () => {
              const value = await registeredFixture();
              const stored = await value.coordinator.createPlan("sample-api", TARGET);
              value.client.runtimeAvailable = false;
              await assert.rejects(value.coordinator.applyPlan(stored.planId, { approved: true }), OpsHavenError);
              assert.equal(value.client.mutationCalls, 0);
            });
          });

          """
              if text.count(marker) != 1:
                  raise SystemExit("deployment test marker missing")
              text = text.replace(marker, additions + marker, 1)
          tests.write_text(text)

          docs = Path("docs/state-model.md")
          text = docs.read_text().rstrip()
          heading = "## Deployment plan identity and volatile readiness"
          if heading not in text:
              text += """

          ## Deployment plan identity and volatile readiness

          Exact stale-plan identity binds the registered application and release layout, pinned host identity, current revision, active release and rollback target, service state, runtime readiness, policy and authorization profile, operation definitions, and health-check definition. Dispatcher, capability, declaration, receipt, and application-scope identities are verified by the canonical installation-health preflight before planning or apply.

          The plan records observed free disk space for operator review and audit, but exact free-byte counts are volatile and are not part of the observed-state fingerprint. At apply time OpsHaven re-inspects the host and requires `availableDiskBytes >= DEPLOYMENT_MINIMUM_DISK_BYTES` before any deployment mutation. Clock time, latency, temporary load, transient response timing, and temporary paths are likewise not deployment identity.
          """
              docs.write_text(text)
          PY
      - name: Commit product repair
        shell: bash
        run: |
          git config user.name "OpsHaven Reliability Bot"
          git config user.email "opshaven-reliability@example.invalid"
          git add src/deployment/model.ts src/deployment/planning.ts tests/deployment-plans.test.ts docs/state-model.md
          git diff --cached --quiet && exit 0
          git commit -m "fix: separate volatile readiness from deployment state identity"
          git push origin HEAD:fix/v1-1-clean-room-reliability
