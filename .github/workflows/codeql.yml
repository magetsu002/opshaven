name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "19 3 * * 1"
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: github/codeql-action/init@a2983b8bed1923f44751c5c43237f479442827b3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@a2983b8bed1923f44751c5c43237f479442827b3
        with:
          category: "/language:javascript-typescript"
          upload: never
          output: codeql-results
      - run: node scripts/codeql-check.mjs codeql-results
